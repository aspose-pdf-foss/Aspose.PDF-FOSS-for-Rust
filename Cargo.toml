[package]
name = "aspose-pdf-foss"
version = "1.26.11"
edition = "2021"
rust-version = "1.86"
license = "MIT AND OFL-1.1"
description = "Free, open-source Rust library for working with PDF documents. No dependencies."
repository = "https://github.com/aspose-pdf-foss/Aspose.PDF-FOSS-for-Rust"
readme = "README.md"
keywords = ["pdf", "rendering", "text-extraction", "aspose"]
categories = ["text-processing", "multimedia::images", "rendering"]

# Paths that exist for contributors working in the repository and have no
# business in a published package: the methodology documentation, which is
# process material rather than part of this library, the agent tooling
# under `.claude/` with the contributor guide that drives it, and the CI
# configuration.
#
# Tests and fixtures deliberately stay in: a consumer can run the suite
# against the published source, which is the point of shipping it.
exclude = [
    "docs/methodology",
    ".claude",
    "CLAUDE.md",
    ".gitmodules",
    ".gitlab-ci.yml",
    ".github",
]

# `from_scratch only` strategy lock for the Rust track —
# foundation primitives are composed from scratch against the
# format spec / BCL contract. No `flate2`, no `image`, no
# `jpeg-encoder`, no `byteorder`, no `node:zlib`-equivalent
# shortcut crates. std-only baseline.
#
# Rationale: parallel to the TypeScript track lockdown — the
# methodology is honestly tested only when the lib's primitives
# are composed by the toolchain rather than wrapped around a
# mature ecosystem dep. Operator may relax this rule per
# primitive, but the default is "no" and exceptions go through
# explicit operator-approved overlay edits.
[dependencies]

[dev-dependencies]

[lib]
path = "src/lib.rs"

# Integration-test discovery — Cargo's default convention is
# `tests/<name>.rs` (each .rs at the tests/ root is its own test
# crate; subdirectories are shared-helper module roots, not test
# crates). The peer cpp / csharp / typescript libs split tests into
# `tests/internal/` (foundation freeze-gate drivers) and
# `tests/public/` (public-API smokes). To preserve that layout
# under cargo, every gate driver gets an explicit `[[test]]`
# entry mapping its path. New foundation primitives append a
# matching `[[test]]` block here as they ship.
[[test]]
name = "asciihex_test"
path = "tests/internal/asciihex_test.rs"

